<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO 紀錄表單 · 彰銓企業股份有限公司</title>
<meta name="description" content="ISO 9001 表單線上填寫：模具變更單、流程變更單、出貨同意單。">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=2026-10-30.7">
<link rel="stylesheet" href="assets/drawer.css?v=2026-10-30.7">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-line">ISO 9001 · Documented Information</div>
      <h1>ISO 紀錄表單</h1>
      <p data-company>彰銓企業股份有限公司</p>
    </div>
    <div class="header-meta">
      <div><span class="dot"></span><span data-updated>管制版本</span></div>
      <div>表單版本以文件管制總表為準</div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <nav class="tabs" data-nav aria-label="表單切換"></nav>
    <div class="actions">
      <button type="button" class="btn btn-primary" data-act="record">儲存紀錄</button>
      <button type="button" class="btn" data-act="history">歷史紀錄 <span class="badge" data-count>0</span></button>
      <button type="button" class="btn" data-act="save">儲存草稿</button>
      <button type="button" class="btn" data-act="check">檢查必填</button>
      <button type="button" class="btn" data-act="export">匯出 JSON</button>
      <label class="btn file-btn">載入 JSON<input type="file" accept="application/json,.json" data-import></label>
      <button type="button" class="btn btn-primary" data-act="print">列印／存 PDF</button>
      <button type="button" class="btn btn-ghost" data-act="clear">清除草稿</button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress"><span data-progress></span></div>
    <span class="progress-label" data-progress-label>0% 完成</span>
    <span class="status" data-status>尚未填寫</span>
  </div>
</div>

<main data-main></main>

<footer class="app-foot">
  <span>彰銓企業股份有限公司 · ISO 9001 表單管制｜版次異動須同步 docs/文件管制總表.csv 與 docs/版本歷程總表.md</span>
  <span data-storage-note>紀錄儲存於本機瀏覽器</span>
</footer>

<div class="drawer" data-drawer hidden>
  <div class="drawer-mask" data-drawer-close></div>
  <aside class="drawer-panel" role="dialog" aria-label="歷史紀錄">
    <div class="drawer-head">
      <div>
        <h2 data-drawer-title>歷史紀錄</h2>
        <p class="drawer-sub" data-drawer-sub></p>
      </div>
      <button type="button" class="btn btn-ghost" data-drawer-close>關閉</button>
    </div>
    <div class="drawer-tools">
      <input type="search" data-record-search placeholder="搜尋單號、申請人、產品…" aria-label="搜尋紀錄">
      <button type="button" class="btn btn-sm" data-record-reload title="重新向雲端取得最新清單">重新整理</button>
      <span class="drawer-count" data-drawer-count></span>
    </div>
    <div class="drawer-body" data-record-list></div>
  </aside>
</div>

<script src="assets/config.js?v=2026-10-30.7"></script>
<script src="assets/forms.js?v=2026-10-30.7"></script>
<script src="assets/storage.js?v=2026-10-30.7"></script>
<script src="assets/app.js?v=2026-10-30.7"></script>
<script>
(function () {
  var SEEN = "2026-10-30.7";
  fetch("version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("no version"); return r.json(); })
    .then(function (d) {
      if (d && d.v && d.v !== SEEN && !sessionStorage.getItem("iso:reloaded")) {
        sessionStorage.setItem("iso:reloaded", "1");
        location.reload();
      }
    })
    .catch(function () {});
})();
</script>
</body>
</html>
